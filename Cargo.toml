[package]
name = "theater-control-panel"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[lib]
name = "theater_control_panel"
crate-type = ["cdylib"]

[dependencies]
wry = "0.57"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same versions wry uses, for direct WebView2 access (mute, zoom events, the
# source's composition hosting), Win32 windows, and the source's capture.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "System",
    "UI_Composition",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"
# #[implement] (audio.rs) expands to windows_core paths.
windows-core = "0.62"

[build-dependencies]
cc = "1"
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }
